name: CMake

on: [push]


jobs:
  # The ubuntu-20.04 runners (g++-10, clang++-10, clang++-11) have been retired. Test the oldest and
  # newest compilers preinstalled on the current images.
  build:
    name: Test build with ${{ matrix.cxx }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - { os: ubuntu-22.04, cc: gcc-10,   cxx: g++-10 }
        - { os: ubuntu-22.04, cc: clang-13, cxx: clang++-13 }
        - { os: ubuntu-24.04, cc: gcc-14,   cxx: g++-14 }
        - { os: ubuntu-24.04, cc: clang-18, cxx: clang++-18 }

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
       submodules: recursive
    - name: Conduct CMake test
      uses: HyperHDG/actions@cmake
      with:
        c_compiler: ${{ matrix.cc }}
        cxx_compiler: ${{ matrix.cxx }}
